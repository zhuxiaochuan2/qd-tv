workflows:
  ios-unsigned:
    name: QingTV unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen || true
          xcodegen --version
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned
        script: |
          cd ios
          xcodebuild -project QingTV.xcodeproj -scheme QingTV -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/QingTV.app Payload/
          zip -qry QingTV.ipa Payload
          ls -lh QingTV.ipa
    artifacts:
      - QingTV.ipa
